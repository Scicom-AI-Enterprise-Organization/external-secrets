name: Build and Push HuaweiCloud Image

on:
  push:
    branches:
      - feat/huaweicloud-csms-provider
      - main
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_REPO: scicom-ai-enterprise-organization/external-secrets

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set image tag
        id: tag
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "tag=huaweicloud-${SHA}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build binaries
        run: |
          for ARCH in amd64 arm64 s390x ppc64le; do
            CGO_ENABLED=0 GOOS=linux GOARCH=${ARCH} \
              go build -tags all_providers \
              -o bin/external-secrets-linux-${ARCH} main.go
          done

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ env.IMAGE_REPO }}:latest
